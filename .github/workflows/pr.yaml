name: PR checks
on:
  pull_request:
  push:
    branches:
      - feature/github-actions

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v3

      - name: Lint
        run: ./gradlew lintKotlin

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ktlint-report
          path: build/reports/ktlint

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v3

      - name: Build and host tests
        run: ./gradlew :kaluga-uitest:testAndroidHostTest

      - name: Build example
        run: ./gradlew :example-android:assembleDebug
        working-directory: example

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-report
          path: "**/build/reports/tests"

  android-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD snapshot created"

      - name: Run Android device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd example && ./gradlew :example-android:connectedAndroidTest

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-device-test-report
          path: example/example-android/build/reports/androidTests

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - uses: gradle/actions/setup-gradle@v3

      - name: Pre-warm Gradle for Xcode build script
        run: ./gradlew help
        working-directory: example

      - name: Run iOS example tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project example/example-ios/ExampleApp.xcodeproj \
            -scheme ExampleApp \
            -destination 'platform=iOS Simulator,OS=26.2,name=iPhone 17' \
            | tee xcodebuild.log | xcpretty

      - name: Upload xcodebuild log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
