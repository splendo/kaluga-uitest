on:
  pull_request

jobs:
  check:
    name: Check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - uses: gradle/actions/setup-gradle@v3

      - name: assemble
        run: ./gradlew assemble
